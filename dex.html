<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regalos navideños 2026 · Perfume Paradise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#F6F6F8;--surface:#FFFFFF;--ink:#141519;--muted:#5D5F68;--line:#E3E3E8;--chip:#EEEEF2;
  --blue:#4656D8;--on-blue:#FFFFFF;--gold:#C99300;--ok:#2F6B53;--warn:#A4462F;--warn-bg:#FBEAE4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131418;--surface:#1C1D23;--ink:#EEEEF2;--muted:#A4A6AF;--line:#2E3038;--chip:#26272F;
  --blue:#8C98FF;--on-blue:#10122A;--gold:#F5BE1E;--ok:#7FC4A3;--warn:#F0937A;--warn-bg:#3A2420;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#131418;--surface:#1C1D23;--ink:#EEEEF2;--muted:#A4A6AF;--line:#2E3038;--chip:#26272F;
  --blue:#8C98FF;--on-blue:#10122A;--gold:#F5BE1E;--ok:#7FC4A3;--warn:#F0937A;--warn-bg:#3A2420;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 130px}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hero{padding:26px 0 0;display:flex;gap:14px;align-items:center}
.logo{width:60px;height:60px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line)}
.kicker{font-size:13px;color:var(--muted);line-height:1.4}
h1{font-size:clamp(42px,10vw,60px);line-height:1;margin:26px 0 10px}
.lede{color:var(--muted);margin:0 0 26px;max-width:52ch}
.back{display:inline-flex;align-items:center;gap:6px;margin:22px 0 0;padding:6px 0;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
/* tarjetas de inicio */
.cards{display:grid;gap:12px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--blue)}
.card:active{transform:scale(.99)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-size:26px}
.card .price{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.card p{margin:2px 0 12px;color:var(--muted);font-size:14px}
.mini{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.card .go{display:block;margin-top:12px;font-size:14px;font-weight:700;color:var(--blue)}
.more{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:14px}
.budget{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.budget label{font-weight:600;font-size:14px;width:100%}
.budget input{font:600 16px Manrope,sans-serif;flex:1;min-width:140px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.link{border:0;background:none;padding:6px 0;color:var(--blue)}
.msg{font-size:14px;color:var(--muted)}
/* resumen */
.sum{margin:14px 0 4px}
.sum h1{margin:0 0 6px;font-size:clamp(36px,8vw,48px)}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.status{font-size:14px;font-weight:600;margin-top:2px}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.idle{color:var(--muted)}
.meter{display:flex;gap:2px;margin:14px 0 4px}
.meter i{flex:1;height:22px;border-radius:5px 5px 3px 3px;background:var(--chip);transition:background .2s}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px;margin:22px 0 14px}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:26px;border-radius:5px 5px 3px 3px}
.rname{font-weight:600;line-height:1.3}
.rmeta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rmeta s{opacity:.7;margin-right:6px}
.rval{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.rval small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.stepper button.plus:not(:disabled){border-color:var(--blue);color:var(--blue)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.groups{display:grid;gap:10px}
.group{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.group summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:700;list-style:none}
.group summary::-webkit-details-marker{display:none}
.group summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;transition:transform .2s}
.group[open] summary::after{transform:rotate(225deg)}
.group summary .meta{margin-left:auto;color:var(--muted);font-weight:500;font-size:14px}
.bad{color:var(--warn);font-weight:700}
.group ol{margin:0;padding:0 16px 10px;list-style:none}
.group li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.group li .p{flex:1;min-width:0}
.group li em{font-style:normal;color:var(--muted);text-align:right;display:flex;align-items:center;gap:6px}
.group li em i,.sel i{width:8px;height:14px;border-radius:4px 4px 2px 2px;flex:none}
.sel{display:flex;align-items:center;gap:6px;max-width:62%}
.sel select{font:500 14px Manrope,sans-serif;max-width:100%;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sel select.dup{border-color:var(--warn)}
.new{display:inline-block;vertical-align:2px;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);border:1px solid var(--blue);border-radius:999px;padding:1px 6px}
.tag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:999px;white-space:nowrap}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.sticky .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sticky .count{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:700;line-height:1}
.sticky .count small{font-size:16px;color:var(--muted);font-weight:500}
.sticky .money{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.fix{margin-top:12px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .btn{flex:1;text-align:center;text-decoration:none}
.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.dl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0}
.dl .msg{font-size:13px}
.kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;max-width:calc(100% - 36px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.dock .btn[data-pdf]{flex:0 0 auto}
.was{color:var(--muted);text-decoration-color:#C43E3E;text-decoration-thickness:2px;font-weight:500;margin-right:8px;font-size:.85em}
.pricebox{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0 6px}
.pricebox .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pricebox .lbl.blue{color:var(--blue);margin-top:6px}
.big2{font-size:20px;margin:0;display:inline-block}
.save{text-align:right;color:var(--blue);min-width:130px;display:grid;gap:2px;border-left:1px solid var(--line);padding-left:16px}
.save span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.save b{font-size:20px;font-variant-numeric:tabular-nums}
.save small{font-size:12px;color:var(--muted)}
@media (max-width:420px){.pricebox{flex-direction:column;align-items:stretch}.save{min-width:0;text-align:left;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}}
.note{font-size:13px;color:var(--muted);margin-top:24px}
.screen{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockin"></div></div>
<script>
const REFS = [
 {id:'cdreams',name:'Coach Dreams Sunset',size:'EDP 90 ml',reg:73,price:68,color:'#F2A65A',isNew:true},
 {id:'cfloral',name:'Coach Floral',size:'EDP 90 ml',reg:79,price:74,color:'#F4B6C2',isNew:true},
 {id:'coach',name:'Coach Wild Rose',size:'90 ml',reg:78,price:73,color:'#E58A8A',isNew:false},
 {id:'lightblue',name:'Dolce & Gabbana Light Blue',size:'100 ml',reg:88,price:83,color:'#8FB8D8',isNew:false},
 {id:'theone',name:'Dolce & Gabbana The One',size:'EDP 75 ml',reg:90,price:85,color:'#C99A5B',isNew:false},
 {id:'theonegold',name:'Dolce & Gabbana The One Gold Intense',size:'EDP 100 ml',reg:90,price:85,color:'#D9A520',isNew:true},
 {id:'onlyone',name:'Dolce & Gabbana The Only One',size:'EDP 100 ml',reg:98,price:93,color:'#7A3B69',isNew:true},
 {id:'boss',name:'Hugo Boss The Scent For Her',size:'EDP 100 ml',reg:85,price:80,color:'#B5865E',isNew:false},
 {id:'choo',name:'Jimmy Choo I Want Choo',size:'100 ml',reg:85,price:80,color:'#D65C6E',isNew:false},
 {id:'choolp',name:'Jimmy Choo I Want Choo Le Parfum',size:'100 ml',reg:90,price:85,color:'#8E2C48',isNew:true},
 {id:'idole',name:'Lancôme Idôle',size:'100 ml',reg:118,price:113,color:'#E3C27A',isNew:false},
 {id:'lavie',name:'Lancôme La Vie Est Belle',size:'100 ml',reg:114,price:109,color:'#B07AA1',isNew:false},
 {id:'miracle',name:'Lancôme Miracle',size:'EDP 100 ml',reg:100,price:95,color:'#E58FA0',isNew:false},
 {id:'mb',name:'Montblanc Signature',size:'90 ml',reg:74,price:69,color:'#5E6F8A',isNew:false},
 {id:'toy2',name:'Moschino Toy 2',size:'100 ml',reg:72,price:67,color:'#9CC9B4',isNew:false},
 {id:'toybubble',name:'Moschino Toy 2 Bubble Gum',size:'EDT 100 ml',reg:70,price:65,color:'#F28DB2',isNew:true},
 {id:'toypearl',name:'Moschino Toy 2 Pearl',size:'EDP 100 ml',reg:78,price:73,color:'#CFC9E8',isNew:true},
 {id:'tous',name:'Tous LoveMe Onyx',size:'100 ml',reg:73,price:68,color:'#4A4A55',isNew:false},
 {id:'versace',name:'Versace Bright Crystal',size:'EDT 90 ml',reg:85,price:80,color:'#E7A9B8',isNew:false},
 {id:'dylan',name:'Versace Dylan Purple',size:'EDP 100 ml',reg:88,price:83,color:'#6B4FA0',isNew:true},
];
const GROUPS = [
 {name:'Panamá 1',people:['Yaminy Montenegro','Karla Gaitán','Yailin Yanguez','Olga Delgado','Noris Gutiérrez','Yariela Barrozo','Ana Cáceres','Edilma Pérez','Evelyn Lizondro','Silvia Paris','Aura Almengor','Migdalia Cubilla']},
 {name:'Veraguas',people:['Meibis Monterrey','Emma Sáenz','Yeskany Núñez','María Rodríguez','Odeth González']},
 {name:'Panamá 2',people:['Rita Zaldívar','Estelvina Cedeño','Ana Ruiz','Liriomar Cedeño','Erika Mendoza','Marianela Poveda','Katherine Villarreal']},
 {name:'Coclé',people:['Nuris González','Nievelis Pinzón','Vielca González']},
 {name:'Panamá 3',people:['Yulitza Concepción','Elvia Espinosa','Eva González','Deyka Otero','Kenia Quintero']},
 {name:'Darién',people:['Astrid González','Victorina Melgar','Kenia Otero','Yulissa Rojas']},
 {name:'Tortí',people:['Luz Ostia','Yesica Rudas','Esmeralda Amaya','Marlyn Alonzo']},
 {name:'Panamá 4',people:['Marisol Ellington','Heidi Caballero','Briceida Ramos','Yalenis Serrano','Ilka Ríos','Nereida González','Susan Barría']},
];
const TOTAL = GROUPS.reduce((s,g)=>s+g.people.length,0);
const MAXPER = GROUPS.length;
const sum = c => c.reduce((a,b)=>a+b,0);
const cost = c => c.reduce((a,n,i)=>a+n*REFS[i].price,0);

function solve(c){
  const R=REFS.length,Gn=GROUPS.length,N=R+Gn+2,S=0,T=N-1;
  const cap=Array.from({length:N},()=>new Array(N).fill(0));
  for(let r=0;r<R;r++){cap[S][1+r]=c[r];for(let g=0;g<Gn;g++)cap[1+r][1+R+g]=1;}
  for(let g=0;g<Gn;g++)cap[1+R+g][T]=GROUPS[g].people.length;
  let flow=0;
  while(true){
    const par=new Array(N).fill(-1);par[S]=S;const q=[S];
    while(q.length&&par[T]<0){const u=q.shift();for(let v=0;v<N;v++)if(par[v]<0&&cap[u][v]>0){par[v]=u;q.push(v);}}
    if(par[T]<0)break;
    let b=Infinity;for(let v=T;v!==S;v=par[v])b=Math.min(b,cap[par[v]][v]);
    for(let v=T;v!==S;v=par[v]){cap[par[v]][v]-=b;cap[v][par[v]]+=b;}
    flow+=b;
  }
  const f=[];for(let r=0;r<R;r++){f.push([]);for(let g=0;g<Gn;g++)f[r].push(cap[1+R+g][1+r]>0?1:0);}
  return {f,flow};
}
const okPartial = c => solve(c).flow===sum(c);
const GS = GROUPS.map(g=>g.people.length).sort((a,b)=>b-a);
function okFull(c){ if(sum(c)!==TOTAL)return false; let L=0;
  for(let k=1;k<=GS.length;k++){L+=GS[k-1];let Rs=0;for(const x of c)Rs+=Math.min(x,k);if(L>Rs)return false;}
  return true; }

function distribute(c){
  const {f}=solve(c);
  const out=GROUPS.map(()=>[]);
  REFS.forEach((_,r)=>GROUPS.forEach((_,g)=>{if(f[r][g])out[g].push({r,dup:false});}));
  REFS.forEach((_,r)=>{
    let left=c[r]-f[r].reduce((a,b)=>a+b,0);
    while(left>0){
      let best=-1,bestRoom=0;
      GROUPS.forEach((G,g)=>{const room=G.people.length-out[g].length;if(room>bestRoom){bestRoom=room;best=g;}});
      if(best<0)break;
      out[best].push({r,dup:true});left--;
    }
  });
  out.forEach(l=>l.sort((a,b)=>a.dup-b.dup||a.r-b.r));
  return out;
}

function greedyFill(c,order){
  c=c.slice();
  while(sum(c)<TOTAL){
    let moved=false;
    for(const r of order){if(c[r]>=MAXPER)continue;c[r]++;if(okPartial(c)){moved=true;break;}c[r]--;}
    if(!moved)return null;
  }
  return okFull(c)?c:null;
}
const byPrice = dir => REFS.map((_,i)=>i).sort((a,b)=>dir*(REFS[a].price-REFS[b].price));
const ones = () => REFS.map(()=>1);
function economy(){return greedyFill(REFS.map(()=>0),byPrice(1));}
function premium(){return greedyFill(REFS.map(()=>0),byPrice(-1));}
function balanced(){
  const c=REFS.map(()=>0);let i=0;const order=byPrice(1);
  while(sum(c)<TOTAL){c[order[i%order.length]]++;i++;}
  return okFull(c)?c:null;
}
const sq = c => c.reduce((a,n)=>a+n*n,0);
function forBudget(budget){
  let c=economy(); if(!c||cost(c)>budget) return {c:null,min:c?cost(c):null};
  const R=REFS.length;
  const tryMoves=(pick)=>{let best=null;
    for(let a=0;a<R;a++)for(let b=0;b<R;b++){if(a===b||c[a]<=1||c[b]>=MAXPER)continue;
      const n=c.slice();n[a]--;n[b]++; if(cost(n)>budget||!okFull(n))continue;
      const s=pick(n); if(s!==null&&(!best||s<best.s))best={n,s};}
    return best;};
  for(let k=0;k<300;k++){const m=tryMoves(n=>sq(n)<sq(c)?sq(n)*1e4-cost(n):null);if(!m)break;c=m.n;}
  for(let k=0;k<300;k++){const m=tryMoves(n=>cost(n)>cost(c)?sq(n):null);if(!m)break;c=m.n;}
  return {c,min:null};
}

function buildQuotePDF(jsPDF,o){
  const doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,H=792,M=46;
  const INK=[20,21,25],MUTED=[93,95,104],LINE=[227,227,232],BLUE=[70,86,216],GOLD=[245,184,0],SOFT=[246,246,248];
  const money=n=>'B/. '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const lab=r=>REFS[r].name+(REFS[r].size?' '+REFS[r].size:'');
  const countsOf=a=>REFS.map((_,r)=>a.flat().filter(x=>x===r).length);
  const dupOf=(a,g,k)=>a[g][k]>=0&&a[g].indexOf(a[g][k])!==k;
  const tc=c=>doc.setTextColor(c[0],c[1],c[2]),fc=c=>doc.setFillColor(c[0],c[1],c[2]),dc=c=>doc.setDrawColor(c[0],c[1],c[2]);
  function header(){
    if(o.logo)doc.addImage(o.logo,'PNG',M,30,46,46,'pplogo','FAST');
    doc.setFont('helvetica','bold');doc.setFontSize(9);tc(MUTED);
    doc.text('REGALOS NAVIDEÑOS 2026',W-M,44,{align:'right'});
    doc.setFont('helvetica','normal');doc.text(o.client,W-M,57,{align:'right'});doc.text(o.date,W-M,70,{align:'right'});
    fc(GOLD);doc.rect(M,88,28,2.5,'F');dc(LINE);doc.setLineWidth(.6);doc.line(M+32,89.2,W-M,89.2);
    return 118;
  }
  function h1(t,y,size){doc.setFont('times','bold');doc.setFontSize(size||28);tc(INK);doc.text(t,M,y);return y;}
  function para(t,y,w){doc.setFont('helvetica','normal');doc.setFontSize(10.5);tc(MUTED);const l=doc.splitTextToSize(t,w||W-2*M);doc.text(l,M,y,{lineHeightFactor:1.45});return y+l.length*15.2;}
  function stats(items,y){

const $=id=>document.getElementById(id);
const fmt=n=>'B/. '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const label=r=>REFS[r].name+(REFS[r].size?' '+REFS[r].size:'');
const empty=()=>GROUPS.map(G=>G.people.map(()=>-1));
let A=empty(),TITLE='',VIEW={detalle:'perfume',editar:'perfume'};
try{const s=JSON.parse(localStorage.getItem('pp-2026-v3')||'null');if(s&&Array.isArray(s.a)&&s.a.length===GROUPS.length){A=s.a;TITLE=s.t||'';}}catch(e){}
const save=()=>{try{localStorage.setItem('pp-2026-v3',JSON.stringify({a:A,t:TITLE}));}catch(e){}};

const countsOf=a=>REFS.map((_,r)=>a.flat().filter(x=>x===r).length);
const isDup=(g,k)=>A[g][k]>=0&&A[g].indexOf(A[g][k])!==k;
const dupsIn=g=>A[g].filter((_,k)=>isDup(g,k)).length;
const dupTotal=()=>GROUPS.reduce((s,_,g)=>s+dupsIn(g),0);
function fromCounts(c){const d=distribute(c);A=d.map((l,g)=>GROUPS[g].people.map((_,k)=>l[k]?l[k].r:-1));}
function inc(r){
  if(sum(countsOf(A))>=TOTAL)return;
  let best=-1,room=0;
  A.forEach((row,g)=>{const e=row.filter(x=>x<0).length;if(e>room&&!row.includes(r)){room=e;best=g;}});
  if(best>=0){A[best][A[best].indexOf(-1)]=r;return;}
  const c=countsOf(A);c[r]++;fromCounts(c);
}
function dec(r){
  for(let g=0;g<A.length;g++)for(let k=0;k<A[g].length;k++)if(A[g][k]===r&&isDup(g,k)){A[g][k]=-1;return;}
  for(let g=A.length-1;g>=0;g--)for(let k=A[g].length-1;k>=0;k--)if(A[g][k]===r){A[g][k]=-1;return;}
}
const RECS=[
  {id:'fr',name:'Cotización',desc:'Fragancias frescas y alegres, con protagonismo de Moschino, Coach y Tous.',c:economy()},
].filter(r=>r.c);
let BUDGET=null;

const regOf=c=>c.reduce((a,n,i)=>a+n*REFS[i].reg,0);
const bar=c=>`<div class="mini" aria-hidden="true">${c.map((k,i)=>k?`<span style="flex:${k};background:${REFS[i].color}"></span>`:'').join('')}</div>`;
const card=r=>`<button class="card" data-open="${r.id}"><div class="card-top"><h3>${r.name}</h3><span class="price">${fmt(cost(r.c))}</span></div><p>${r.desc}</p>${bar(r.c)}<span class="go">Ver detalle y editar →</span></button>`;
function statusText(){
  const n=sum(countsOf(A)),d=dupTotal();
  if(n===0)return['idle','Aún no hay perfumes.'];
  if(d)return['warn',d===1?'1 perfume se repite en una sucursal.':`${d} perfumes se repiten en una sucursal.`];
  if(n<TOTAL)return['ok',`Sin repeticiones. Faltan ${TOTAL-n}.`];
  return['ok','47 perfumes, ninguno se repite en su sucursal.'];
}
const meter=()=>{const seq=[];countsOf(A).forEach((k,i)=>{for(let j=0;j<k;j++)seq.push(REFS[i].color);});
  return `<div class="meter" aria-hidden="true">${Array.from({length:TOTAL},(_,i)=>`<i style="${seq[i]?'background:'+seq[i]:''}"></i>`).join('')}</div>`;};
const seg=(scr)=>`<div class="seg" role="group" aria-label="Vista">
  <button data-seg="${scr}:perfume" aria-pressed="${VIEW[scr]==='perfume'}">Por perfume</button>
  <button data-seg="${scr}:sucursal" aria-pressed="${VIEW[scr]==='sucursal'}">Por sucursal</button></div>`;

function home(){
  return `<div class="screen">
  <header class="hero"><img class="logo" src="${LOGO}" alt="Perfume Paradise" width="60" height="60"><div class="kicker">Regalos navideños 2026<br>para Subasta Ganadera</div></header>
  <h1>Hola, Yaminy</h1>
  <p class="lede">Te preparé una cotización para las 47 colaboradoras. Ábrela para ver el detalle; puedes cambiar cualquier perfume entre los 20 disponibles (8 son nuevos este año).</p>
  <div class="kick">Recomendada</div>
  <div class="cards">${RECS.map(card).join('')}</div>
  <div class="dl"><button class="btn" data-pdf="home">Descargar cotización en PDF</button></div>
  <div class="more"><form class="budget" id="bform" onsubmit="return false"><label for="budget">¿Tienen un presupuesto? Escríbelo y armamos la cotización a ese monto.</label>
    <input id="budget" inputmode="decimal" placeholder="Ej. 3500" autocomplete="off"><button class="btn" id="fit" type="submit">Armar</button></form>
    <div class="msg" id="bmsg"></div></div></div>`;
}
function detail(){
  const c=countsOf(A),n=sum(c),[cls,txt]=statusText();
  let body;
  if(VIEW.detalle==='perfume'){
    body=`<ul class="list">${c.map((k,i)=>k?`<li class="row"><span class="dot" style="background:${REFS[i].color}"></span><div><div class="rname">${REFS[i].name}${REFS[i].isNew?' <span class="new">Nuevo</span>':''}</div><div class="rmeta">${REFS[i].size?REFS[i].size+' · ':''}${k} × ${fmt(REFS[i].price)}</div></div><div class="rval">${fmt(k*REFS[i].price)}</div></li>`:'').join('')}</ul>`;
  } else body=groupsView(false);
  return `<div class="screen">
  <button class="back" data-go="">← Inicio</button>
  <div class="sum"><h1>${TITLE||'Tu cotización'}</h1><div class="big">${fmt(cost(c))}</div>
    <div class="status ${cls}">${n} de ${TOTAL} perfumes · ${txt}</div>
    <div class="dl"><button class="btn primary" data-pdf>Descargar cotización en PDF</button></div></div>
  ${meter()}${seg('detalle')}${body}
  <p class="note">Precios por unidad con descuento incluido.</p></div>`;
}
function groupsView(edit){
  return `<div class="groups">${GROUPS.map((G,g)=>{const filled=A[g].filter(x=>x>=0).length,bad=dupsIn(g);
    return `<details class="group" data-g="${g}"${OPEN.has(g)?' open':''}><summary>${G.name}<span class="meta">${bad?`<span class="bad">${bad} repetido${bad>1?'s':''}</span> · `:''}${filled}/${G.people.length}</span></summary><ol>${
      G.people.map((p,k)=>{const r=A[g][k],dup=isDup(g,k);
        if(!edit)return `<li><span class="p">${p}</span><em>${r>=0?`<i style="background:${REFS[r].color}"></i>${label(r)}${dup?' <span class="tag">Repetido</span>':''}`:'Sin asignar'}</em></li>`;
        return `<li><span class="p">${p}</span><span class="sel">${r>=0?`<i style="background:${REFS[r].color}"></i>`:''}<select data-p="${g},${k}" class="${dup?'dup':''}" aria-label="Perfume para ${p}"><option value="-1">Sin asignar</option>${REFS.map((R,i)=>`<option value="${i}"${i===r?' selected':''}${A[g].includes(i)&&i!==r?' data-taken':''}>${A[g].includes(i)&&i!==r?'· ':''}${R.name}</option>`).join('')}</select></span></li>`;
      }).join('')}</ol></details>`;}).join('')}</div>`;
}
function editor(){
  const c=countsOf(A),n=sum(c),[cls,txt]=statusText(),d=dupTotal();
  let body;
  if(VIEW.editar==='perfume'){
    body=`<ul class="list">${REFS.map((R,i)=>`<li class="row"><span class="dot" style="background:${R.color}"></span><div><div class="rname">${R.name}${R.isNew?' <span class="new">Nuevo</span>':''}</div><div class="rmeta">${R.size?R.size+' · ':''}${fmt(R.price)}</div></div><div class="stepper"><button data-dec="${i}" aria-label="Quitar ${R.name}"${c[i]?'':' disabled'}>−</button><output>${c[i]}</output><button class="plus" data-inc="${i}" aria-label="Agregar ${R.name}"${n>=TOTAL?' disabled':''}>+</button></div></li>`).join('')}</ul>`;
  } else body=`<p class="msg">Elige el perfume de cada persona. Los marcados con · ya están en esa sucursal.</p>`+groupsView(true);
  return `<div class="screen">
  <button class="back" data-go="detalle">← Ver resumen</button>
  <div class="sticky"><div class="line"><div class="count">${n} <small>de ${TOTAL}</small></div><div class="money">${fmt(cost(c))}</div></div>
    ${meter()}<div class="status ${cls}">${txt}</div>
    ${d?`<button class="btn fix" data-fix>Reacomodar para no repetir</button>`:''}</div>
  ${seg('editar')}${body}
  <p class="note">Precios por unidad con descuento incluido.</p></div>`;
}
const OPEN=new Set([0]);
function dock(scr){
  const d=$('dock'),c=countsOf(A),n=sum(c);
  if(scr===''){d.hidden=true;return;}
  d.hidden=false;
  const wa='https://wa.me/50763126594?text='+encodeURIComponent(message());
  $('dockin').innerHTML=(scr==='detalle'?`<button class="btn" data-go="editar">Editar</button>`:`<button class="btn" data-go="detalle">Listo</button>`)+`<button class="btn" data-pdf aria-label="Descargar cotización en PDF">PDF</button>`+
    `<a class="btn wa" href="${wa}" target="_blank" rel="noopener">Enviar a Sthefan</a>`;
}
function message(){
  const c=countsOf(A),n=sum(c),d=dupTotal();
  let m=`Hola Sthefan, esta es la cotización que queremos para los regalos navideños 2026 de Subasta Ganadera${/editada/.test(TITLE)?' (con cambios sobre la recomendada)':''}:\n\n`;
  c.forEach((k,i)=>{if(k)m+=`• ${k} × ${label(i)}: ${fmt(k*REFS[i].price)}\n`;});
  m+=`\n*Total: ${n} perfumes, ${fmt(cost(c))}*\n`;
  if(n<TOTAL)m+=`(Faltan ${TOTAL-n} por definir)\n`;
  if(d)m+=`(${d} perfume${d>1?'s':''} se repite${d>1?'n':''} dentro de una sucursal)\n`;
  m+='\n*Reparto por sucursal*\n';
  GROUPS.forEach((G,g)=>{m+=`\n_${G.name}_\n`;G.people.forEach((p,k)=>{const r=A[g][k];m+=`- ${p}: ${r>=0?label(r)+(isDup(g,k)?' (repetido)':''):'sin asignar'}\n`;});});
  return m;
}
let last=null;
function render(keepScroll){
  let scr=location.hash.replace('#','');
  if(!['','detalle','editar'].includes(scr))scr='';
  if(scr!==''&&sum(countsOf(A))===0&&scr==='detalle')scr='editar';
  const y=window.scrollY;
  $('app').innerHTML=scr==='detalle'?detail():scr==='editar'?editor():home();
  dock(scr);
  if(keepScroll&&last===scr)window.scrollTo(0,y);else window.scrollTo(0,0);
  last=scr;save();
}
const go=h=>{if(location.hash.replace('#','')===h)render();else location.hash=h;};
window.addEventListener('hashchange',()=>render());
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-pdf],[data-open],[data-go],[data-seg],[data-inc],[data-dec],[data-fix],[data-scratch]');if(!t)return;
  if(t.dataset.pdf!==undefined){if(t.dataset.pdf==='home'){fromCounts(RECS[0].c);TITLE=RECS[0].name;save();}downloadPDF(t);return;}
  if(t.dataset.open){const r=(BUDGET&&BUDGET.id===t.dataset.open)?BUDGET:RECS.find(x=>x.id===t.dataset.open);fromCounts(r.c);TITLE=r.name;OPEN.clear();OPEN.add(0);go('detalle');}
  else if(t.dataset.go!==undefined){if(t.dataset.go==='')history.replaceState(null,'',location.pathname+location.search),render();else go(t.dataset.go);}
  else if(t.dataset.seg){const[s,v]=t.dataset.seg.split(':');VIEW[s]=v;render(true);}
  else if(t.dataset.inc){inc(+t.dataset.inc);edited();render(true);}
  else if(t.dataset.dec){dec(+t.dataset.dec);edited();render(true);}
  else if(t.dataset.fix!==undefined){fromCounts(countsOf(A));render(true);}
  else if(t.dataset.scratch!==undefined){A=empty();TITLE='Tu cotización';go('editar');}
});
document.addEventListener('toggle',e=>{const g=e.target.dataset&&e.target.dataset.g;if(g===undefined)return;e.target.open?OPEN.add(+g):OPEN.delete(+g);},true);
document.addEventListener('change',e=>{const s=e.target.closest('select[data-p]');if(!s)return;const[g,k]=s.dataset.p.split(',').map(Number);A[g][k]=+s.value;edited();render(true);});
document.addEventListener('submit',e=>{if(e.target.id!=='bform')return;e.preventDefault();
  const v=parseFloat(($('budget').value||'').replace(/[^0-9.]/g,''));
  if(!v){$('bmsg').textContent='Escribe un monto, por ejemplo 3600.';return;}
  const r=forBudget(v);
  if(!r.c){$('bmsg').textContent=`El mínimo para los 47 perfumes sin repetir es ${fmt(r.min)}.`;return;}
  fromCounts(r.c);TITLE='Cotización según presupuesto';OPEN.clear();OPEN.add(0);go('detalle');
});
function edited(){if(TITLE&&!/editada|Tu cotización/.test(TITLE))TITLE+=' (editada)';}
let DL=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){DL=await window.claude.use('downloads');if(DL&&location.hash==='#detalle')render(true);}}catch(e){DL=null;}})();
let toastT;function toast(t,ms){const el=$('toast');el.textContent=t;el.classList.toggle('on',!!t);clearTimeout(toastT);if(t&&ms)toastT=setTimeout(()=>el.classList.remove('on'),ms);}
async function downloadPDF(btn){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J||!J.API.autoTable){toast('Cargando, intenta de nuevo en unos segundos.',3000);return;}
  btn.disabled=true;toast('Preparando el PDF…');
  try{
    if(!DL&&window.claude&&typeof window.claude.use==='function'){try{DL=await window.claude.use('downloads');}catch(e){DL=null;}}
    const date=new Date().toLocaleDateString('es-PA',{day:'numeric',month:'long',year:'numeric'});
    const rec=TITLE===RECS[0].name,bud=/presupuesto/.test(TITLE),ed=/editada/.test(TITLE);
    const q={title:'Cotización',a:A,kicker:ed?'PERSONALIZADA':bud?'SEGÚN PRESUPUESTO':rec?'RECOMENDADA':'PERSONALIZADA'};
    if(rec)q.desc='Fragancias frescas y alegres, con protagonismo de Moschino, Coach y Tous. Ningún perfume se repite dentro de una misma sucursal; cualquier perfume se puede cambiar por otro del catálogo.';
    const doc=buildQuotePDF(J,{logo:LOGO,client:'Subasta Ganadera',date,quotes:[q]});
    const name='Cotizacion-Perfume-Paradise-2026'+(/editada/.test(TITLE)?'-editada':'')+'.pdf';
    const blob=doc.output('blob');
    if(DL){await DL.save({filename:name,data:blob});toast('Listo.',2500);}
    else{const url=URL.createObjectURL(blob);const w=window.open(url,'_blank');
      if(w)toast('El PDF se abrió en otra pestaña.',3500);else toast('Abre esta página en claude.ai para descargar el PDF.',4500);}
  }catch(e){toast(e&&e.code==='declined'?'':'No se pudo descargar en esta vista.',3500);}
  finally{btn.disabled=false;}
}

render();
</script>
